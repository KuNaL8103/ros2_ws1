controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

diff_cont:
  ros__parameters:
    left_wheel_names:
      - body_to_back_left_wheel
    right_wheel_names:
      - body_to_back_right_wheel
    wheel_separation: 1.46
    wheel_radius: 0.4175
    wheel_separation_multiplier: 1.0
    base_frame_id: body
    odom_frame_id: odom
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
